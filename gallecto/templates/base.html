<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Gallecto 博客，记录技术、分享经验、沉淀思考。">
  <title>{% block title %}Gallecto 博客{% endblock %}</title>

  {% load static %}
  <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/csdn-style.css' %}" rel="stylesheet">
  <link href="{% static 'css/inner-juejin.css' %}" rel="stylesheet">
  {% block additionalCSS %}{% endblock %}

  <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
  <script src="https://malsup.github.com/jquery.form.js"></script>
</head>
<body>

  <!-- 顶部导航 -->
  <nav class="csdn-nav">
    <div class="nav-inner">
      <a class="csdn-brand" href="/">
        <span class="brand-logo">码</span>
        <span>Gallecto 技术博客</span>
      </a>

      <div class="csdn-nav-links">
        <a href="/" class="{% block navHome %}{% endblock %}">首页</a>
        <a href="/blog" class="{% block navBlog %}{% endblock %}">分类</a>
        <a href="/blog" class="{% block navBlogPost %}{% endblock %}">文章</a>
        <a href="/admin/">后台管理</a>
      </div>

      <form class="csdn-search" action="/blog" method="get">
        <input type="text" name="q" placeholder="搜索文章或标签">
        <button type="submit">搜索</button>
      </form>
    </div>
  </nav>

  <main class="csdn-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="csdn-footer">
    <div class="csdn-container">
      <p class="mb-0">© 2019-2026 Gallecto 博客 · 使用 Django 构建</p>
    </div>
  </footer>

  <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  {% block additionalJS %}{% endblock %}
</body>
</html>
